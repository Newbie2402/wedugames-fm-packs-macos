name = "fm-updater"
main = "src/index.js"
compatibility_date = "2026-10-01"

# "true": every request needs a license ticket from the WeduGames license Worker (product fmpacks27).
# "false" lets anyone with this Worker's URL download every pack.
[vars]
REQUIRE_LICENSE = "true"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fm-updater"
