[workspace]
resolver = "2"
members = ["crates/core", "crates/packer", "crates/publisher", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# Hardened for the shipped customer binary: full LTO and a single codegen unit
# inline across crates and leave fewer recognisable function boundaries, and
# strip removes all symbol and debug names. Makes the exe much harder to read.
lto = "fat"
codegen-units = 1
strip = "symbols"
